[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "koml-planner"
version = "0.1.0"
description = "Deterministic hand-written work package scaffolds"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
kpl = "kpl.cli:main"

[tool.setuptools.package-data]
kpl = ["templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
